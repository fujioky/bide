# deploy-host 上的整套服务。note 仓库的 compose 通过 include 并入，共用 edge 网络与同一个 Caddy。
# 运行位置：/opt/bide/deploy；数据卷在 /srv/<服务名>。
name: bide

include:
  - path: /opt/note/compose.yml

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  networks: [edge]

services:
  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/caddy/data:/data
      - /srv/caddy/config:/config
    <<: *common

  bide:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file: ../secrets/env/bide.env
    volumes: ["/srv/bide:/data"]
    mem_limit: 512m
    depends_on: [quant, agent]
    <<: *common

  quant:
    build: ../quant
    env_file: ../secrets/env/quant.env
    volumes: ["/srv/quant:/data"]
    mem_limit: 1200m
    <<: *common

  agent:
    build: ../agent
    env_file: ../secrets/env/agent.env
    volumes: ["/srv/agent:/data"]
    mem_limit: 768m
    <<: *common

networks:
  edge:
    external: true
