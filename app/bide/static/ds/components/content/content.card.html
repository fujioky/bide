<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="/ds/shell.css">
<link rel="stylesheet" href="/ds/tokens/fonts.css">
<link rel="stylesheet" href="/ds/tokens/base.css">
<link rel="stylesheet" href="/ds/ds-runtime.css">
<style>
body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:0}
.wrap{max-width:680px;margin:0 auto;padding:var(--sp-6) var(--sp-6) var(--sp-8)}
.lbl{font-family:var(--font-code);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);margin:var(--sp-7) 0 var(--sp-3);display:block}
.lbl:first-child{margin-top:0}
p{margin:0 0 var(--sp-4);font-size:var(--fs-small);line-height:var(--lh-body)}

/* CodeBlock */
figure.code{margin:0;background:var(--code-bg);border:1px solid var(--border-hairline);
  border-radius:var(--radius-3);overflow:hidden}
figure.code figcaption{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--border-hairline)}
figure.code figcaption span{font-family:var(--font-code);font-size:11px;
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
figure.code figcaption button{display:inline-flex;align-items:center;gap:5px;background:none;
  border:0;color:var(--text-muted);cursor:pointer;font-family:var(--font-code);font-size:11px}
figure.code pre{margin:0;padding:var(--sp-4);overflow-x:auto;font-size:var(--fs-code);
  line-height:var(--lh-code);color:var(--code-fg);background:transparent}

/* Callout */
.callout{margin:0 0 var(--sp-4);padding:var(--sp-4) var(--sp-4);background:var(--surface-raised);
  border-left:var(--border-accent) solid var(--accent);border-radius:0 var(--radius-3) var(--radius-3) 0;
  font-size:var(--fs-small);line-height:var(--lh-body)}
.callout b{display:block;margin-bottom:4px;color:var(--text-heading);font-size:var(--fs-micro);
  font-family:var(--font-code);letter-spacing:.08em;text-transform:uppercase}
.callout.warn{border-left-color:var(--tokyo-orange,#ff9e64)}
.callout.warn b{color:var(--tokyo-orange,#ff9e64)}

/* PullQuote */
blockquote{margin:0 0 var(--sp-4);padding-left:var(--sp-5);border-left:2px solid var(--accent)}
blockquote p{margin:0;font-size:var(--fs-lead);line-height:var(--lh-essay);color:var(--text-muted)}
blockquote cite{display:block;margin-top:var(--sp-3);font-size:var(--fs-small);
  font-style:normal;color:var(--text-muted);opacity:.8}

/* FigureImage */
figure.img{margin:0}
figure.img .box{aspect-ratio:16/9;background:var(--surface-inset);overflow:hidden;
  border-radius:var(--radius-3);border:1px solid var(--border-hairline);box-shadow:var(--shadow-card)}
figure.img img{width:100%;height:100%;object-fit:cover;display:block}
figure.img figcaption{margin-top:var(--sp-3);font-size:var(--fs-micro);color:var(--text-muted)}

.themes{display:flex;gap:6px;flex-wrap:wrap;margin:var(--sp-6) 0 0}
.themes button{padding:5px 12px;border-radius:var(--radius-pill);cursor:pointer;background:transparent;
  border:1px solid var(--border-hairline);color:var(--text-muted);font-family:var(--font-code);font-size:11px}
.themes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
</style></head>
<body data-lyra-theme="tech">
<div class="wrap">

<span class="lbl">CodeBlock · 点复制按钮试试</span>
<figure class="code">
  <figcaption><span>python</span><button type="button" aria-label="复制">复制</button></figcaption>
  <pre><code>import torch

def flow_matching_target(x0, x1, t):
    """x0: 噪声  x1: 数据  t: [B, 1]"""
    xt = (1 - t) * x0 + t * x1
    vt = x1 - x0            # 恒定速度场
    return xt, vt</code></pre>
</figure>

<span class="lbl">CodeBlock · 另一种语言</span>
<figure class="code">
  <figcaption><span>javascript</span><button type="button" aria-label="复制">复制</button></figcaption>
  <pre><code>const rail = document.querySelector('.lyra-toc-rail');
// 悬停时把邻近两条也撑开
rail.addEventListener('mouseenter', () =&gt; spread(0));
export default rail;</code></pre>
</figure>

<span class="lbl">Callout</span>
<div class="callout"><b>提示</b>先用 128³ 体素把整条链路跑通，再考虑分辨率。</div>
<div class="callout warn"><b>警告</b>在 float16 下速度场的方差会被截断，训练中期容易塌到均值脸。</div>

<span class="lbl">PullQuote · 古文自动切 --font-quote-cjk</span>
<blockquote>
  <p>泽上有地，临。君子以教思无穷，容保民无疆。</p>
  <cite>— 易 · 临卦</cite>
</blockquote>

<span class="lbl">PullQuote · 现代中文不切</span>
<blockquote>
  <p>把采样步数写进 checkpoint 的元数据，否则三个月后你不会记得这条曲线是几步跑出来的。</p>
  <cite>— 训练日志 · 第 31 epoch</cite>
</blockquote>

<span class="lbl">FigureImage · 点图放大</span>
<figure class="img">
  <div class="box"><img src="/posts/eu-phd-salary/assets/pipeline.png" alt="筛选流程图：岗位搜索后依次判断是否岗位制雇员、是否计算机方法为主、工资相对当地是否不低"></div>

</figure>

<span class="lbl">换肤</span>
<div class="themes">
  <button type="button" data-t="tech" aria-pressed="true">tech</button>
  <button type="button" data-t="home" aria-pressed="false">home</button>
  <button type="button" data-t="data" aria-pressed="false">data</button>
  <button type="button" data-t="essay" aria-pressed="false">essay</button>
  <button type="button" data-t="tutorial" aria-pressed="false">tutorial</button>
  <button type="button" data-t="magazine" aria-pressed="false">magazine</button>
</div>

</div>
<script src="/ds/ds-runtime.js"></script>
<script>
document.querySelectorAll('.themes button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.body.dataset.lyraTheme = b.dataset.t;
    document.querySelectorAll('.themes button').forEach(function (x) {
      x.setAttribute('aria-pressed', x === b);
    });
  });
});
</script>
</body></html>
