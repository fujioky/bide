<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px;}.lbl{font-family:var(--font-mono-display);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}</style><link rel="stylesheet" href="/ds/ds-runtime.css"><script src="/ds/ds-runtime.js" defer></script></head>
<body data-lyra-theme="home"><div id="root"></div><script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const DS = window.LyraBlogDesignSystem_fbfdef;

const { LyraIcon } = DS;
const names=['menu','x','chevron-right','chevron-down','arrow-up','arrow-left','rss','sparkles','copy','play','list','lightbulb','triangle-alert','circle-check','lock'];
function Demo(){
  return <div style={{display:'grid',gridTemplateColumns:'repeat(8,1fr)',gap:14}}>
    {names.map(n=><div key={n} style={{display:'grid',gap:6,justifyItems:'center'}}><LyraIcon name={n} size={20}/><span className="lbl" style={{fontSize:8}}>{n}</span></div>)}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
